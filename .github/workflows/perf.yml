name: Performance and soak

# Profiling, microbenchmarking, and long stress/soak/chaos runs, kept out of the per-push CI so they can
# run for a long time without gating merges. Trigger it manually (Actions tab) with chosen durations, or
# let the nightly schedule run a bounded version. All logs, the JMH JSON, and the native-memory diff are
# uploaded as an artifact.
#
# The soak runs the FFM path under a deliberately small heap (the 'soak' profile, -Xmx256m) with
# native-memory tracking, so a leak or allocation-pressure bug surfaces under constraint instead of behind
# a runner's RAM. The leak watch fails the run if resident memory grows without bound under the heap cap.
#
# GitHub-hosted runners cap a job at 6 hours. For multi-hour or overnight soaks, dispatch with longer
# durations (within the timeout below) or run on a self-hosted runner.

on:
  workflow_dispatch:
    inputs:
      stress_seconds:
        description: 'FfmStressIT: the FFM binary path under sustained concurrent load'
        default: '3600'
      fault_seconds:
        description: 'FfmFaultIT: the FFM path under sustained backend kills'
        default: '1800'
      chaos_seconds:
        description: 'ReactiveChaosIT: the change feed under a sustained random fault storm'
        default: '900'
      leak_seconds:
        description: 'Native-memory leak watch: hammer the FFM path and watch resident memory'
        default: '1800'
      jmh_args:
        description: 'Extra JMH args, e.g. "-f 3" for more forks or "-prof gc" to profile allocation'
        default: '-f 2'
  schedule:
    # Nightly at 07:00 UTC, a bounded run (the fallback durations below, single JMH fork). Re-enabled
    # after fixing the cause of the recurring failures: ReactiveChaosIT's fixed 120s @Timeout could not
    # cover the nightly's 180s storm (it timed out before recovery), and a wal_sender leak on failed
    # START_REPLICATION exhausted max_wal_senders under sustained reconnect churn so the feed never
    # recovered. Both are fixed and validated at the nightly's 180s duration.
    - cron: '0 7 * * *'

# One long perf run at a time; never cancel an in-flight soak.
concurrency:
  group: perf
  cancel-in-progress: false

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MONOLITH_TEST_CONNINFO: host=localhost dbname=monolith_test user=postgres
      # Nightly durations (the dispatch inputs override these). Kept modest so the nightly fits the timeout.
      STRESS_SECONDS: ${{ github.event.inputs.stress_seconds || '600' }}
      FAULT_SECONDS: ${{ github.event.inputs.fault_seconds || '300' }}
      CHAOS_SECONDS: ${{ github.event.inputs.chaos_seconds || '180' }}
      LEAK_SECONDS: ${{ github.event.inputs.leak_seconds || '600' }}
    steps:
      - uses: actions/checkout@v4

      # Logical decoding for the reactive layer; trust auth keeps it password-free.
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=monolith_test \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 postgres:18 -c wal_level=logical
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U postgres && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; exit 1

      # libpq is the client library the FFM runtime binds at run time.
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y libpq5

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # maven.test.skip (not just skipTests) so this step does not compile any module's TEST sources —
      # the benchmark jar is built from main sources only. -DskipTests still compiles test code, which
      # made this step needlessly recompile monolith-runtime's generated invalidation test fixtures
      # against whatever artifacts the maven cache held; a stale runtime once mixed with fresh codegen
      # here and failed the build before any soak ran. The later "install" + soak steps compile and run
      # the tests for real, so nothing is lost.
      - name: Build benchmark runner
        run: mvn -B -Pbenchmarks -pl monolith-benchmarks -am package -Dmaven.test.skip=true

      - name: Microbenchmarks (JMH)
        run: >
          java --enable-native-access=ALL-UNNAMED
          -jar monolith-benchmarks/target/benchmarks.jar
          ${{ github.event.inputs.jmh_args || '-f 1' }}
          -rf json -rff jmh-result.json -foe true | tee jmh.log

      # Install the reactor so the soak can run a single module in isolation.
      - name: Build reactor for the soak
        run: mvn -B -DskipTests install

      - name: 'Soak: FFM binary path under sustained load'
        env:
          MONOLITH_STRESS_SECONDS: ${{ env.STRESS_SECONDS }}
        run: >
          mvn -B -Psoak -Djacoco.skip=true -pl monolith-runtime
          test -Dtest=FfmStressIT | tee soak-stress.log

      - name: 'Soak: FFM path under sustained backend kills'
        env:
          MONOLITH_FAULT_SECONDS: ${{ env.FAULT_SECONDS }}
        run: >
          mvn -B -Psoak -Djacoco.skip=true -pl monolith-runtime
          test -Dtest=FfmFaultIT | tee soak-fault.log

      - name: 'Soak: change feed under a sustained fault storm'
        env:
          MONOLITH_CHAOS_SECONDS: ${{ env.CHAOS_SECONDS }}
        run: >
          mvn -B -Djacoco.skip=true -pl monolith-reactive
          test -Dtest=ReactiveChaosIT -Dsurefire.failIfNoSpecifiedTests=false | tee soak-chaos.log

      # Hammer the FFM path under a 256MB heap with native-memory tracking, baseline after warmup, and
      # watch resident memory. Heap is capped, so RSS growth is native: an Arena or MemorySegment that is
      # not being freed. Fail the run if it grows past the threshold.
      - name: 'Native-memory leak watch'
        run: |
          java --enable-native-access=ALL-UNNAMED -Xmx256m -XX:NativeMemoryTracking=summary \
            -jar monolith-benchmarks/target/benchmarks.jar BinaryQueryBench \
            -f 1 -wi 1 -w 10 -i 1 -r "${LEAK_SECONDS}" > leakbench.log 2>&1 &
          PID=$!
          sleep 45 # warm up: let the JIT settle and the pool fill before the baseline
          RSS_START=$(ps -o rss= -p "$PID" 2>/dev/null | tr -d ' ')
          jcmd "$PID" VM.native_memory baseline > /dev/null 2>&1 || true
          RSS_END="${RSS_START:-0}"
          # Poll resident memory while the workload runs, keeping the last reading and a fresh NMT diff.
          while kill -0 "$PID" 2>/dev/null; do
            CUR=$(ps -o rss= -p "$PID" 2>/dev/null | tr -d ' ')
            [ -n "$CUR" ] && RSS_END="$CUR"
            jcmd "$PID" VM.native_memory summary.diff > nmt-diff.log 2>&1 || true
            sleep 15
          done
          wait "$PID" 2>/dev/null || true
          GROWTH_MB=$(( ( ${RSS_END:-0} - ${RSS_START:-0} ) / 1024 ))
          echo "RSS start=${RSS_START}KB end=${RSS_END}KB growth=${GROWTH_MB}MB (heap capped at 256MB)" | tee nmt.log
          if [ "${GROWTH_MB:-0}" -gt 150 ]; then
            echo "::error::resident memory grew ${GROWTH_MB}MB under a 256MB heap cap: likely an Arena/MemorySegment leak"
            exit 1
          fi
          echo "no native-memory leak detected: RSS stable within threshold"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            jmh-result.json
            jmh.log
            soak-stress.log
            soak-fault.log
            soak-chaos.log
            leakbench.log
            nmt-diff.log
            nmt.log
          if-no-files-found: warn
