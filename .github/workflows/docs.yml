name: Docs

# Builds the documentation site with Bun and validates it on every change.
# The deploy step is intentionally omitted until the host is chosen:
#   - GitHub Pages: add actions/upload-pages-artifact + actions/deploy-pages.
#   - Firebase Hosting: add FirebaseExtended/action-hosting-deploy (uses website/firebase.json).

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/docs.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: website/dist
